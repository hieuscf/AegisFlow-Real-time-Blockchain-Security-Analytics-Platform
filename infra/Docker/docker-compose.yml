# =============================================================================
# AegisFlow — Local Infrastructure (Docker Compose)
# =============================================================================

name: aegisflow
# MVP stack: Zookeeper, Kafka, Redis, PostgreSQL
#
# Secrets & credentials: copy .env.example → .env (never commit .env)
#
# Quick start (run from this directory: infra/docker):
#
#   copy .env.example .env
#   docker compose up -d          # Start all services in background
#   docker compose ps             # Check service status
#   docker compose logs kafka     # Kafka broker logs
#   docker compose logs kafka-init  # Topic bootstrap logs
#
# Admin UIs (after stack is up):
#   Kafka UI  → http://localhost:8080
#   pgAdmin   → http://localhost:5050
#
# Verify Kafka topics were created:
#
#   docker compose exec kafka kafka-topics \
#     --bootstrap-server localhost:9092 --list
#
# Expected output includes: market-swaps, security-alerts
#
# Stop stack:
#
#   docker compose down           # Stop containers (volumes preserved)
#   docker compose down -v        # Stop and remove named volumes
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Zookeeper — coordination service required by Kafka (Confluent Platform)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: aegis_zookeeper
    hostname: zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Kafka — event bus (port 9092 for host/local services, no auth)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aegis_kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Host clients (Go Indexer, Node.js Analytics)
      - "${KAFKA_BROKER_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Dual listeners: external (host) + internal (Docker network)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # Single-broker local dev settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - aegis_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka Init — one-shot job: create MVP topics after broker is healthy
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aegis_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP:-kafka:29092}
      KAFKA_TOPIC_MARKET_SWAPS: ${KAFKA_TOPIC_MARKET_SWAPS:-market-swaps}
      KAFKA_TOPIC_SECURITY_ALERTS: ${KAFKA_TOPIC_SECURITY_ALERTS:-security-alerts}
    networks:
      - aegis_network
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "[kafka-init] Waiting for broker..."
        cub kafka-ready -b "$${KAFKA_BOOTSTRAP_SERVERS}" 1 60
        echo "[kafka-init] Creating topic: $${KAFKA_TOPIC_MARKET_SWAPS}"
        kafka-topics --bootstrap-server "$${KAFKA_BOOTSTRAP_SERVERS}" --create --if-not-exists \
          --topic "$${KAFKA_TOPIC_MARKET_SWAPS}" --partitions 1 --replication-factor 1
        echo "[kafka-init] Creating topic: $${KAFKA_TOPIC_SECURITY_ALERTS}"
        kafka-topics --bootstrap-server "$${KAFKA_BOOTSTRAP_SERVERS}" --create --if-not-exists \
          --topic "$${KAFKA_TOPIC_SECURITY_ALERTS}" --partitions 1 --replication-factor 1
        echo "[kafka-init] Topics ready:"
        kafka-topics --bootstrap-server "$${KAFKA_BOOTSTRAP_SERVERS}" --list

  # ---------------------------------------------------------------------------
  # Kafka UI — browse topics, messages, consumer groups (local dev)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aegis_kafka_ui
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aegisflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_INTERNAL_BOOTSTRAP:-kafka:29092}
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - aegis_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7 — caching layer (optional password via REDIS_PASSWORD in .env)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    hostname: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Basic RDB persistence; enable --requirepass when REDIS_PASSWORD is set
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --save 60 1 --loglevel warning --requirepass "$${REDIS_PASSWORD}";
        else
          exec redis-server --save 60 1 --loglevel warning;
        fi
    volumes:
      - redis_data:/data
    networks:
      - aegis_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 — relational store for alerts, audit metadata, etc.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aegis_postgres
    hostname: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — PostgreSQL web console (local dev)
  # Register server manually: host=postgres, port=5432, use POSTGRES_* creds
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: aegis_pgadmin
    hostname: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - aegis_network
    restart: unless-stopped

# =============================================================================
# Named volumes — survive `docker compose down` (removed only with `down -v`)
# =============================================================================
volumes:
  postgres_data:
    name: aegis_postgres_data
  redis_data:
    name: aegis_redis_data
  pgadmin_data:
    name: aegis_pgadmin_data

# =============================================================================
# Bridge network — DNS: kafka, redis, postgres, zookeeper, kafka-ui, pgadmin
# =============================================================================
networks:
  aegis_network:
    name: aegis_network
    driver: bridge
